# Template for Tanks & Temples scenes (NSVF layout: rgb/, pose/, intrinsics.txt).
#
# Frames split by the first character of the filename: 0* train, 1* test.
#
# Point a run at a scene with:
#   --index <run name> --scene_1.index <scene> \
#   --scene_1.dataset.path <scene dir> --scene_1.eval.dataset.path <scene dir> \
#   --test_dataset_path <scene dir>
#
# Everything not listed here comes from base.yml.
base: "base.yml"
index: "Final_Truck"
dataset_root: "./data/tanks_temples/"
scene_1:
  index: "truck"
  dataset:
    coord_scale: 40.0
    type: "t2"
    original_image_width: 1920
    original_image_height: 1080
    white_bg: true
    path: "pretrained_albedo_transparent_bg_Truck"
    image_file_format: "npy"
  geoms:
    points:
      init_scale: [1.0, 1.0, 1.0]
      num: 5000
      add_sample_type: "acc-coord-grad-norm-max"
    background:
      constant: 4.0
  models:
    # w_SC = 0.125 (supplement, real-world): w_SC = albedo_loss_weight / rgb_loss_weight
    albedo_loss_weight: 1.0
    transformer:
      embed:
        key:
          ff_act: "relu"
        query:
          ff_act: "relu"
        value:
          ff_act: "relu"
          skip_layers: []
  training:
    prune_stop: 250000
    prune_thresh_list: []
    prune_steps_list: []
    add_stop: 60000
    lr:
      points:
        base_lr: 0.008
  eval:
    dataset:
      type: "t2"
      white_bg: true
      path: "pretrained_albedo_transparent_bg_Truck"
    img_idx: 0
  test:
    datasets:
    - type: "t2"
      white_bg: true
      path: "pretrained_albedo_transparent_bg_Truck"
