# Environment for training and evaluating Intrinsic PAPR.
# Exported from the environment the paper's runs were produced in
# (Python 3.8.16, PyTorch 2.4.0, CUDA 12.4).
#
# The albedo/shading extraction step needs two extra packages that are not
# on conda; install them into this environment afterwards:
#   pip install "git+https://github.com/compphoto/Intrinsic@main"
# That pulls in `intrinsic`, `chrislib` and `altered_midas`.
name: intrinsic-papr
channels:
  - anaconda
  - conda-forge
  - nvidia/label/cuda-12.4.0
  - nvidia
  - pytorch
  - defaults
